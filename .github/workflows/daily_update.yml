name: Daily Youtube Market Research

on:
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間の午前9時に自動実行
  workflow_dispatch: # ボタン一つで手動実行もできるようにする設定

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 実行結果を保存するために必要
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run research script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: Commit and Push index.html
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Update research report" || exit 0
          git push
